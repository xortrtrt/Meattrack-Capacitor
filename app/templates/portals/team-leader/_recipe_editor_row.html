<div class="ingredient-row" data-edit-recipe-row>
  <label>Ingredient<select name="material_item_id[]" required><option value="">Choose an ingredient</option>{% for material in raw_materials %}<option value="{{ material.raw_material_id }}" {{ 'selected' if row and row.raw_material_id|string == material.raw_material_id|string else '' }}>{{ material.name }} ({{ material.unit }})</option>{% endfor %}</select></label>
  <label>Required per pack<input name="quantity_required[]" type="number" min="0.001" step="0.001" max="999999999.999" value="{{ row.quantity_required if row else '' }}" required></label>
  <label>Input unit<select name="quantity_required_unit[]" required>{% for unit in recipe_units %}<option value="{{ unit }}" {{ 'selected' if row and row.unit == unit else '' }}>{{ unit }}</option>{% endfor %}</select></label>
  <button class="icon-button danger" type="button" data-edit-recipe-remove aria-label="Remove ingredient">×</button>
</div>
