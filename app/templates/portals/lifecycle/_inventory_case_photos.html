<div class="ir-photos">{% for photo in case.attachments %}<a href="/portal/return-attachments/{{ photo.attachment_id }}" target="_blank" rel="noopener" data-return-photo data-photo-title="Supporting photo {{ loop.index }}"><img src="/portal/return-attachments/{{ photo.attachment_id }}" alt="Supporting photo {{ loop.index }} for Return {{ case.return_id }}" loading="lazy"><span>Photo {{ loop.index }}<i data-lucide="expand" aria-hidden="true"></i></span></a>{% else %}<p class="ir-muted">No supporting photos attached.</p>{% endfor %}</div>
