<section class="rd-card"><header><i data-lucide="image" aria-hidden="true"></i><h3>Supporting evidence</h3></header>{% set photos=case.attachments|selectattr('purpose','equalto','evidence')|list %}<div class="rd-evidence">{% for photo in photos %}<a href="/portal/return-attachments/{{ photo.attachment_id }}" target="_blank" rel="noopener" data-return-photo data-photo-title="Supporting photo {{ loop.index }}"><img src="/portal/return-attachments/{{ photo.attachment_id }}" alt="Supporting photo {{ loop.index }} for Return {{ case.return_id }}" loading="lazy"><span>View photo {{ loop.index }}<i data-lucide="zoom-in" aria-hidden="true"></i></span></a>{% else %}<p class="rd-empty">No supporting photos attached.</p>{% endfor %}</div></section>
