<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="csrf-token" content="{{ csrf_token(request) }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activate account | MEATTRACK</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}" />
  </head>
  <body class="login-page activation-page">
    <main class="login-wrapper">
      <section class="login-card">
        <div class="login-panel">
          <h1>Activate your account</h1>
          <p>Create your private password. This activation link can be used once and expires after 24 hours.</p>
          {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
          <form class="login-form" action="/activate" method="post">
            <input type="hidden" name="token" value="{{ token }}" />
            {% if requires_policy_acceptance %}
            <input type="hidden" name="privacy_notice_version" value="{{ privacy_notice_version }}" />
            <input type="hidden" name="terms_version" value="{{ terms_version }}" />
            {% endif %}
            <label>New password<input required type="password" name="new_password" autocomplete="new-password" minlength="8" /></label>
            <label>Confirm password<input required type="password" name="confirm_password" autocomplete="new-password" minlength="8" /></label>
            {% if requires_policy_acceptance %}
            <label class="policy-check">
              <input required type="checkbox" name="privacy_acknowledged" value="yes" />
              <span>I have read the <a href="/privacy" target="_blank" rel="noopener">Privacy Notice</a> and understand how my personal information is handled.</span>
            </label>
            <label class="policy-check">
              <input required type="checkbox" name="terms_accepted" value="yes" />
              <span>I have read and agree to the <a href="/terms" target="_blank" rel="noopener">Terms and Conditions</a>.</span>
            </label>
            {% endif %}
            <button class="login-btn" type="submit">Activate account</button>
          </form>
          <a class="login-back" href="/login">Back to sign in</a>
        </div>
      </section>
    </main>
    <script type="module" src="{{ url_for('static', path='js/core.js') }}?v=20261001-frontend-modules-1"></script>
    <script type="module" src="{{ url_for('static', path='js/forms.js') }}?v=20261001-frontend-modules-1"></script>
  </body>
</html>
