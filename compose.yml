name: meattrack-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-MeatTrack Database}"
      POSTGRES_USER: ${POSTGRES_USER:-meattrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meattrack}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  mail-capture:
    build: .
    command: ["python", "local_mail_capture.py"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8025), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build: .
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: development
      AUTH_RATE_LIMIT_ENABLED: "false"
      CSRF_PROTECTION_ENABLED: "false"
      BUSINESS_TIMEZONE: Asia/Manila
      APP_BASE_URL: http://127.0.0.1:8000
      LOGIN_OTP_ENABLED: ${LOGIN_OTP_ENABLED:-false}
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-MeatTrack Database}"
      POSTGRES_USER: ${POSTGRES_USER:-meattrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meattrack}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-1}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-change-this-local-dev-secret}
      CONSENT_VERSION: ${CONSENT_VERSION:-2026-07-22}
      BREVO_API_KEY: local-development
      BREVO_API_URL: http://mail-capture:8025/v3/smtp/email
      BREVO_FROM_EMAIL: local@meattrack.test
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Batangas Premium}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-demo123}
      TEAM_LEADER_PASSWORD: ${TEAM_LEADER_PASSWORD:-demo1234}
      RESELLER_PASSWORD: ${RESELLER_PASSWORD:-demo1234}
      DEFAULT_ACCOUNT_PASSWORD: ${DEFAULT_ACCOUNT_PASSWORD:-demo1234}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      mail-capture:
        condition: service_started

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    healthcheck:
      disable: true
    environment: &worker-environment
      APP_ENV: development
      AUTH_RATE_LIMIT_ENABLED: "false"
      CSRF_PROTECTION_ENABLED: "false"
      BUSINESS_TIMEZONE: Asia/Manila
      APP_BASE_URL: http://127.0.0.1:8000
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-MeatTrack Database}"
      POSTGRES_USER: ${POSTGRES_USER:-meattrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meattrack}
      DATABASE_POOL_MIN: 1
      DATABASE_POOL_MAX: 3
      BREVO_API_KEY: local-development
      BREVO_API_URL: http://mail-capture:8025/v3/smtp/email
      BREVO_FROM_EMAIL: local@meattrack.test
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Batangas Premium}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      mail-capture:
        condition: service_started

volumes:
  postgres_data:
