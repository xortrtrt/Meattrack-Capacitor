name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests tools
      - run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meattrack_test
          POSTGRES_USER: meattrack
          POSTGRES_PASSWORD: meattrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meattrack -d meattrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: development
      AUTH_RATE_LIMIT_ENABLED: "false"
      CSRF_PROTECTION_ENABLED: "false"
      BUSINESS_TIMEZONE: Asia/Manila
      DATABASE_URL: postgresql://meattrack:meattrack@127.0.0.1:5432/meattrack_test
      REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tools tests
      - run: python tools/migrate_database.py
      - run: python -m pytest -q
      - run: python tools/import_supabase_database.py --self-check

  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meattrack_e2e
          POSTGRES_USER: meattrack
          POSTGRES_PASSWORD: meattrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meattrack -d meattrack_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: development
      AUTH_RATE_LIMIT_ENABLED: "false"
      CSRF_PROTECTION_ENABLED: "true"
      BUSINESS_TIMEZONE: Asia/Manila
      DATABASE_URL: postgresql://meattrack:meattrack@127.0.0.1:5432/meattrack_e2e
      SESSION_SECRET_KEY: ci-e2e-session-secret
      RATE_LIMIT_HASH_KEY: ci-e2e-rate-limit-secret
      LOGIN_OTP_ENABLED: "false"
      LIVE_CHAT_ENABLED: "false"
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_SUPERVISOR_EMAIL: supervisor.e2e@meattrack.test
      E2E_SUPERVISOR_PASSWORD: Meattrack-E2E-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/migrate_database.py
      - run: python tools/seed_e2e_account.py
      - name: Start application
        shell: bash
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn-e2e.log 2>&1 &
          echo $! > uvicorn-e2e.pid
      - name: Wait for application health
        shell: bash
        run: |
          python - <<'PY'
          import time
          import urllib.request

          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Application did not become healthy")
          PY
      - run: pytest -q tests/e2e
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-e2e-log
          path: uvicorn-e2e.log

  production-security:
    runs-on: ubuntu-latest
    env:
      RATE_LIMIT_HASH_KEY: ci-production-rate-limit-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Production refuses disabled controls
        shell: bash
        run: |
          if APP_ENV=production AUTH_RATE_LIMIT_ENABLED=false CSRF_PROTECTION_ENABLED=true python -c "import app.config"; then exit 1; fi
          if APP_ENV=production AUTH_RATE_LIMIT_ENABLED=true CSRF_PROTECTION_ENABLED=false python -c "import app.config"; then exit 1; fi
      - name: Production accepts enabled controls
        run: python -c "import app.config"
        env:
          APP_ENV: production
          AUTH_RATE_LIMIT_ENABLED: "true"
          CSRF_PROTECTION_ENABLED: "true"
