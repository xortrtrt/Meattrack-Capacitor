name: meattrack-local

# Optional stricter local override for Brevo delivery.
# The base compose file already uses Brevo; this file requires explicit sender settings.
services:
  app:
    environment:
      BREVO_API_KEY: ${BREVO_API_KEY:?Set BREVO_API_KEY in .env}
      BREVO_API_URL: ${BREVO_API_URL:-https://api.brevo.com/v3/smtp/email}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:?Set BREVO_FROM_EMAIL in .env}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Batangas Premium}

  worker:
    environment:
      BREVO_API_KEY: ${BREVO_API_KEY:?Set BREVO_API_KEY in .env}
      BREVO_API_URL: ${BREVO_API_URL:-https://api.brevo.com/v3/smtp/email}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:?Set BREVO_FROM_EMAIL in .env}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Batangas Premium}
