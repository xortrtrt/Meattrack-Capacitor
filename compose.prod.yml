name: meattrack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-MeatTrack Database}"
      POSTGRES_USER: ${POSTGRES_USER:-meattrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 2m
    networks:
      - backend

  migrate:
    build: .
    command: ["python", "tools/migrate_database.py"]
    restart: "no"
    environment:
      APP_ENV: migration
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-MeatTrack Database}"
      POSTGRES_USER: ${POSTGRES_USER:-meattrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_RATE_LIMIT_ENABLED: "true"
      CSRF_PROTECTION_ENABLED: "true"
      BUSINESS_TIMEZONE: Asia/Manila
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in .env.production}
      LOGIN_OTP_ENABLED: ${LOGIN_OTP_ENABLED:-true}
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-MeatTrack Database}"
      POSTGRES_USER: ${POSTGRES_USER:-meattrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-2}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?Set SESSION_SECRET_KEY in .env.production}
      RATE_LIMIT_HASH_KEY: ${RATE_LIMIT_HASH_KEY:?Set RATE_LIMIT_HASH_KEY in .env.production}
      CONSENT_VERSION: ${CONSENT_VERSION:-2026-07-22}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_API_URL: ${BREVO_API_URL:-https://api.brevo.com/v3/smtp/email}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Batangas Premium}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CHAT_TRANSCRIPT_RETENTION_DAYS: ${CHAT_TRANSCRIPT_RETENTION_DAYS:-30}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - profile_uploads:/app/app/static/uploads/profiles
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - frontend

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    environment:
      APP_ENV: production
      AUTH_RATE_LIMIT_ENABLED: "true"
      CSRF_PROTECTION_ENABLED: "true"
      BUSINESS_TIMEZONE: Asia/Manila
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in .env.production}
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-MeatTrack Database}"
      POSTGRES_USER: ${POSTGRES_USER:-meattrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_POOL_MIN: 1
      DATABASE_POOL_MAX: 3
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?Set SESSION_SECRET_KEY in .env.production}
      RATE_LIMIT_HASH_KEY: ${RATE_LIMIT_HASH_KEY:?Set RATE_LIMIT_HASH_KEY in .env.production}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_API_URL: ${BREVO_API_URL:-https://api.brevo.com/v3/smtp/email}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Batangas Premium}
      CHAT_TRANSCRIPT_RETENTION_DAYS: ${CHAT_TRANSCRIPT_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - frontend

volumes:
  postgres_data:
  profile_uploads:
    name: meattrack_profile_uploads

networks:
  backend:
    internal: true
  frontend:
